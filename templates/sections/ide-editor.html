 <div class="mongodb-modal" id="livecodeProjectBrowserModal" onclick="if(event.target===this)closeLiveCodeProjectBrowser();">

       <div class="livecode-finder-toolbar theme-transition">
          <div class="livecode-finder-nav">
             <button type="button" id="livecode-finder-back" class="livecode-finder-nav-btn theme-transition" title="Back" disabled onclick="livecodeBrowserGoBack(); return false;" aria-label="Back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
             </button>
             <button type="button" id="livecode-finder-forward" class="livecode-finder-nav-btn theme-transition" title="Forward" disabled onclick="livecodeBrowserGoForward(); return false;" aria-label="Forward">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
             </button>
          </div>
          <div id="livecode-finder-breadcrumb" class="livecode-finder-breadcrumb theme-transition" aria-label="Current path"></div>
          <div class="livecode-finder-search-wrap theme-transition">
             <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

             <button type="button" class="livecode-finder-sidebar-item theme-transition" data-finder-path="~" onclick="livecodeBrowserNavigate('~'); return false;">Home</button>
             <button type="button" class="livecode-finder-sidebar-item theme-transition" data-finder-path="~/Downloads" onclick="livecodeBrowserNavigate('~/Downloads'); return false;">Downloads</button>
             <button type="button" class="livecode-finder-sidebar-item theme-transition" data-finder-path="~/Desktop" onclick="livecodeBrowserNavigate('~/Desktop'); return false;">Desktop</button>
             <div id="livecode-finder-favorites" class="livecode-finder-fav-list"></div>
          </aside>
          <div class="livecode-finder-table-wrap theme-transition">
             <table class="livecode-finder-table">

                      <th class="livecode-finder-col-size livecode-finder-sort" data-sort-key="size" aria-sort="none" onclick="livecodeBrowserSortBy('size'); return false;"><span class="livecode-finder-sort-label">Size<span class="livecode-finder-sort-arrow"></span></span></th>

                      <th class="livecode-finder-col-date livecode-finder-sort" data-sort-key="mtime" aria-sort="none" onclick="livecodeBrowserSortBy('mtime'); return false;"><span class="livecode-finder-sort-label">Date Added<span class="livecode-finder-sort-arrow"></span></span></th>

       </div>

             <button type="button" id="livecodeBrowserSelectBtn" onclick="selectLiveCodeProjectFromBrowser();return false;" class="mongodb-btn ghost livecode-finder-open-btn" disabled>Open</button>
          </div>
       </div>
    </div>
 </div>
